name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # ── Correctness: compile + test with g++ and clang++ ───────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update -qq && sudo apt-get install -y build-essential g++ clang make

    - name: Build with ${{ matrix.compiler }} (ASan enabled)
      run: make CXX=${{ matrix.compiler }} SANITIZE=1

    - name: Run tests
      run: make CXX=${{ matrix.compiler }} SANITIZE=1 test

    - name: Smoke-run binary
      run: |
        ./bin/train_yourself input/railNetworkPrintFolder/railNetworkNormal3Events.txt input/trainPrintFolder/trainPrintNormal3Events.txt
        ./bin/train_yourself input/railNetworkPrintFolder/railNetworkNormal3Events.txt input/trainPrintFolder/trainPrintNormal3Events.txt --solo
        ./bin/train_yourself input/railNetworkPrintFolder/railNetworkNormal3Events.txt input/trainPrintFolder/trainPrintNormal3Events.txt --graph output/graphs/ci_test.dot

    - name: Verify clean/fclean/re
      run: make CXX=${{ matrix.compiler }} clean && make CXX=${{ matrix.compiler }} fclean && make CXX=${{ matrix.compiler }} re

  # ── Threads: parallel --runs/--compare must be race-free ───────────────
  threads:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update -qq && sudo apt-get install -y build-essential g++ clang make valgrind

    - name: ThreadSanitizer (${{ matrix.compiler }})
      run: make CXX=${{ matrix.compiler }} tsan

    - name: Helgrind (lock order and races)
      if: matrix.compiler == 'g++'
      run: |
        make CXX=g++ all
        valgrind --tool=helgrind --error-exitcode=1 ./bin/train_yourself input/railNetworkPrintFolder/railNetworkBonus09Hub.txt input/trainPrintFolder/trainPrintBonus09Hub.txt --lines --runs 4 > /dev/null

  # ── GUI: Qt bonus builds ───────────────────────────────────────────────
  bonus:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update -qq && sudo apt-get install -y build-essential g++ make qt6-base-dev libgl1-mesa-dev

    - name: Build CLI + Qt GUI bonus
      run: make CXX=g++ && make bonus
