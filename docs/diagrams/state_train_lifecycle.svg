<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="724px" preserveAspectRatio="none" style="width:977px;height:724px;background:#FFFFFF;" version="1.1" viewBox="0 0 977 724" width="977px" zoomAndPan="magnify"><title>Train Lifecycle &#8212; State Machine (Mandatory + Bonus)</title><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="384.4941" x="289.5434" y="23.5352">Train Lifecycle &#8212; State Machine (Mandatory + Bonus)</text></g><g class="entity" data-entity="StopNote" data-source-line="39" data-uid="ent0002" id="entity_StopNote"><path d="M429.06,43.4883 L429.06,124.1523 L698.5385,124.1523 L698.5385,53.4883 L688.5385,43.4883 L429.06,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M688.5385,43.4883 L688.5385,53.4883 L698.5385,53.4883 L688.5385,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="110.7305" x="435.06" y="60.0898">Bonus &#8212; GUI Stop</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.1582" x="435.06" y="74.2227">Not a train state. SimulationWorker's</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.4785" x="435.06" y="88.3555">animation callback checks _stopRequested</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.9492" x="435.06" y="102.4883">and throws SimulationStopException,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.291" x="435.06" y="116.6211">abandoning the run (no results).</text></g><ellipse cx="383.79" cy="83.8183" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="Waiting"><rect fill="#F1F1F1" height="84.7754" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="141.5049" x="313.04" y="214.1483"/><line style="stroke:#181818;stroke-width:0.5;" x1="313.04" x2="454.5449" y1="237.1034" y2="237.1034"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="39.644" x="363.9704" y="229.783">Waiting</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="117.0415" x="318.04" y="252.7381">name, weight, friction</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="121.5049" x="318.04" y="265.6932">accelForce, brakeForce</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="103.2861" x="318.04" y="278.6483">departure &#8594; arrival</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="69.9209" x="318.04" y="291.6034">stopDuration</text></g><g id="Running"><rect fill="#F1F1F1" height="97.7305" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="186.7671" x="290.41" y="374.9283"/><line style="stroke:#181818;stroke-width:0.5;" x1="290.41" x2="477.1771" y1="397.8834" y2="397.8834"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="44.3008" x="361.6432" y="390.563">Running</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="118.2661" x="295.41" y="413.5181">physics loop (1s ticks)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="155.6597" x="295.41" y="426.4732">accelerate / brake / maintain</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="166.7671" x="295.41" y="439.4283">speed capped by segment limit</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="145.3311" x="295.41" y="452.3834">animation callback invoked</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="110.2148" x="295.41" y="465.3384">(if --animate or GUI)</text></g><g id="StoppedAtStation"><rect fill="#F1F1F1" height="71.8203" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="261.7744" x="16.91" y="548.6583"/><line style="stroke:#181818;stroke-width:0.5;" x1="16.91" x2="278.6844" y1="571.6134" y2="571.6134"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="92.3882" x="101.6031" y="564.293">StoppedAtStation</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="241.7744" x="21.91" y="587.2481">NOT a TrainStatus: TrainState::stopTimer &gt; 0</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="196.3726" x="21.91" y="600.2032">also used for event holds (holdTrain)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="227.9438" x="21.91" y="613.1583">heldBySegmentEvent keeps queue position</text></g><g id="Delayed"><rect fill="#F1F1F1" height="58.8652" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="195.0171" x="361.29" y="555.1383"/><line style="stroke:#181818;stroke-width:0.5;" x1="361.29" x2="556.3071" y1="578.0934" y2="578.0934"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="42.4209" x="437.5881" y="570.773">Delayed</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="175.0171" x="366.29" y="593.7281">speed capped by blockedByTrain</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="142.667" x="366.29" y="606.6832">set only by applyBlocking()</text></g><g id="Arrived"><rect fill="#F1F1F1" height="58.8652" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="163.2256" x="775.18" y="555.1383"/><line style="stroke:#181818;stroke-width:0.5;" x1="775.18" x2="938.4056" y1="578.0934" y2="578.0934"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="38.5161" x="837.5347" y="570.773">Arrived</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="143.2256" x="780.18" y="593.7281">actual travel time recorded</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="90.8735" x="780.18" y="606.6832">observer notified</text></g><ellipse cx="856.79" cy="707.4783" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="856.79" cy="707.4783" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="47" data-uid="ent0003" id="entity_GMN2"><path d="M105.76,383.4583 L105.76,464.1223 A0,0 0 0 0 105.76,464.1223 L255.8362,464.1223 A0,0 0 0 0 255.8362,464.1223 L255.8362,427.7883 L290.04,423.7883 L255.8362,419.7883 L255.8362,393.4583 L245.8362,383.4583 L105.76,383.4583 A0,0 0 0 0 105.76,383.4583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M245.8362,383.4583 L245.8362,393.4583 L255.8362,393.4583 L245.8362,383.4583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="120.8262" x="111.76" y="400.0598">Bonus &#8212; Multi-Run</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.3906" x="111.76" y="414.1927">Same lifecycle repeats</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.9316" x="111.76" y="428.3255">N times with different</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.5469" x="111.76" y="442.4583">RNG seeds. Statistics</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="129.0762" x="111.76" y="456.5911">aggregated afterward.</text></g><!--link *start* to Waiting--><g class="link" data-entity-1=".start." data-entity-2="Waiting" data-source-line="9" data-uid="lnk4" id="link_.start._Waiting"><path d="M383.79,94.2383 C383.79,116.6083 383.79,168.0283 383.79,207.9383" fill="none" id="*start*-to-Waiting" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="383.79,213.9383,387.79,204.9383,383.79,208.9383,379.79,204.9383,383.79,213.9383" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.9336" x="412.3496" y="166.7498">Train created</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.0527" x="384.79" y="180.8827">(from input file or GUI)</text></g><!--link Waiting to Running--><g class="link" data-entity-1="Waiting" data-entity-2="Running" data-source-line="11" data-uid="lnk6" id="link_Waiting_Running"><path d="M383.79,299.2383 C383.79,322.1883 383.79,344.7683 383.79,368.6583" fill="none" id="Waiting-to-Running" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="383.79,374.6583,387.79,365.6583,383.79,369.6583,379.79,365.6583,383.79,374.6583" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="162.2109" x="384.79" y="341.5298">simTime &gt;= departureTime</text></g><!--link Running to StoppedAtStation--><g class="link" data-entity-1="Running" data-entity-2="StoppedAtStation" data-source-line="17" data-uid="lnk8" id="link_Running_StoppedAtStation"><path d="M289.93,467.7483 C284.53,469.5583 279.12,471.2183 273.79,472.6583 C219.36,487.3983 59.24,460.4883 21.79,502.6583 C6,520.4483 12.4036,532.8314 33.8236,545.2914" fill="none" id="Running-to-StoppedAtStation" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="39.01,548.3083,33.2417,540.3254,34.688,545.7942,29.2192,547.2405,39.01,548.3083" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.416" x="22.79" y="515.2598">reached intermediate node</text></g><!--link StoppedAtStation to Running--><g class="link" data-entity-1="StoppedAtStation" data-entity-2="Running" data-source-line="25" data-uid="lnk13" id="link_StoppedAtStation_Running"><path d="M187.54,548.5083 C205.16,533.6483 226.47,516.5883 246.79,502.6583 C261.57,492.5283 272.5866,485.5173 288.4866,476.1773" fill="none" id="StoppedAtStation-to-Running" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="293.66,473.1383,283.8738,474.2478,289.3488,475.6708,287.9258,481.1457,293.66,473.1383" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.1855" x="247.79" y="515.2598">stopTimer reaches 0</text></g><!--link Running to Delayed--><g class="link" data-entity-1="Running" data-entity-2="Delayed" data-source-line="18" data-uid="lnk10" id="link_Running_Delayed"><path d="M373.93,472.8283 C372.94,488.0883 374.22,504.6383 380.79,518.6583 C387.45,532.8583 394.2534,541.2446 406.3634,551.0846" fill="none" id="Running-to-Delayed" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="411.02,554.8683,406.5576,546.0884,407.1395,551.7152,401.5127,552.2971,411.02,554.8683" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="188.5488" x="381.79" y="515.2598">blocked by train ahead (per tick)</text></g><!--link Delayed to Running--><g class="link" data-entity-1="Delayed" data-entity-2="Running" data-source-line="30" data-uid="lnk14" id="link_Delayed_Running"><path d="M547.27,554.6583 C572.25,541.5083 589.18,524.0583 574.79,502.6583 C552.72,469.8183 519.869,452.5355 483.109,441.5555" fill="none" id="Delayed-to-Running" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="477.36,439.8383,484.8387,446.2468,482.1508,441.2693,487.1283,438.5814,477.36,439.8383" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.6738" x="581.07" y="515.2598">no longer blocked (reset each tick)</text></g><!--link Running to Arrived--><g class="link" data-entity-1="Running" data-entity-2="Arrived" data-source-line="19" data-uid="lnk12" id="link_Running_Arrived"><path d="M477.53,435.2083 C580.78,447.9883 739.05,471.7983 790.79,502.6583 C811.81,515.1983 825.7527,531.9759 837.3227,549.7959" fill="none" id="Running-to-Arrived" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="840.59,554.8283,839.0439,545.1015,837.8672,550.6347,832.3341,549.458,840.59,554.8283" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="144.2344" x="811.91" y="515.2598">reached final destination</text></g><!--link Arrived to *end*--><g class="link" data-entity-1="Arrived" data-entity-2=".end." data-source-line="34" data-uid="lnk16" id="link_Arrived_.end."><path d="M856.79,614.2183 C856.79,640.6183 856.79,672.3283 856.79,690.2483" fill="none" id="Arrived-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="856.79,696.2483,860.79,687.2483,856.79,691.2483,852.79,687.2483,856.79,696.2483" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.791" x="857.79" y="663.0798">.result file finalised</text></g><!--SRC=[RLHDRzD04BtxLyoD9BI5mYqIbLhn8IHQfAQ80o2qMO_ZKTQxPdUTO4wS-068NzXVmjjrGjpIGsGxysRslJUp4zPYM-LLGoLNgZFnjRDn8J-OJfyLuLymrAfqMx4hgfG9F8eieefyI