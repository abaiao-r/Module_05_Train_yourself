<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="999px" preserveAspectRatio="none" style="width:1035px;height:999px;background:#FFFFFF;" version="1.1" viewBox="0 0 1035 999" width="1035px" zoomAndPan="magnify"><title>Train Lifecycle &#8212; State Machine (Mandatory + Bonus)</title><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="384.4941" x="318.2634" y="23.5352">Train Lifecycle &#8212; State Machine (Mandatory + Bonus)</text></g><ellipse cx="450.75" cy="53.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g id="Waiting"><rect fill="#F1F1F1" height="84.7754" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="141.5049" x="380" y="153.4883"/><line style="stroke:#181818;stroke-width:0.5;" x1="380" x2="521.5049" y1="176.4434" y2="176.4434"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="39.644" x="430.9304" y="169.123">Waiting</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="117.0415" x="385" y="192.0781">name, weight, friction</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="121.5049" x="385" y="205.0332">accelForce, brakeForce</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="103.2861" x="385" y="217.9883">departure &#8594; arrival</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="69.9209" x="385" y="230.9434">stopDuration</text></g><g id="Running"><rect fill="#F1F1F1" height="97.7305" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="186.7671" x="357.36" y="314.2683"/><line style="stroke:#181818;stroke-width:0.5;" x1="357.36" x2="544.1271" y1="337.2234" y2="337.2234"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="44.3008" x="428.5932" y="329.903">Running</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="118.2661" x="362.36" y="352.8581">physics loop (1s ticks)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="155.6597" x="362.36" y="365.8132">accelerate / brake / maintain</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="166.7671" x="362.36" y="378.7683">speed capped by segment limit</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="145.3311" x="362.36" y="391.7234">animation callback invoked</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="110.2148" x="362.36" y="404.6784">(if --animate or GUI)</text></g><g id="StoppedAtStation"><rect fill="#F1F1F1" height="58.8652" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="222.356" x="180.57" y="665.7283"/><line style="stroke:#181818;stroke-width:0.5;" x1="180.57" x2="402.926" y1="688.6834" y2="688.6834"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="92.3882" x="245.5539" y="681.363">StoppedAtStation</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="127.3379" x="185.57" y="704.3181">speed = 0, position = 0</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="202.356" x="185.57" y="717.2732">timer counts down from stopDuration</text></g><g id="Delayed"><rect fill="#F1F1F1" height="58.8652" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="175.6328" x="418.93" y="487.9983"/><line style="stroke:#181818;stroke-width:0.5;" x1="418.93" x2="594.5628" y1="510.9534" y2="510.9534"/><t